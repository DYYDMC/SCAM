name: Build Trajectory Crop GIF App

on:
  workflow_dispatch:
  push:
    paths:
      - "trajectory_crop_gif_app/**"
      - ".github/workflows/build-trajectory-crop-gif.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trajectory_crop_gif_app/requirements-build.txt

      - name: Build executable
        run: |
          python trajectory_crop_gif_app/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-crop-gif-${{ runner.os }}
          path: trajectory_crop_gif_app/dist/**/*
          if-no-files-found: error
